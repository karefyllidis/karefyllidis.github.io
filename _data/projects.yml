- category: industry
  title: "RDH900C — Operating-Envelope Uncertainty Quantification"
  period: "Coolbrook Technologies, 2026"
  description: "Monte Carlo uncertainty-stacking tool for the first commercial RotoDynamic Heater, answering the question that governs a first-of-a-kind commissioning: what shaft speed holds the contracted delivery condition, and with what confidence. Manufacturing tolerance, degradation, operating state, site weather and CFD model-form error are stacked on inverted CFD response surfaces, giving a mean-shift waterfall, Sobol-equivalent variance shares and a two-sigma acceptance check. The headline finding reframed the commissioning conversation: the uncertainty band is set by turbulence-model error, not build tolerance."
  tags:
    - Monte Carlo UQ
    - Response-Surface Models
    - Gaussian Copula / LHS
    - Sensitivity Analysis (Sobol)
    - Python / NumPy
  proprietary: true

- category: phd
  title: "Novel Turbo-Heater & Turbo-Reactor Aerodynamics"
  period: "Oxford PhD, 2019–2024"
  description: "Aerothermal design of axial, radial, mixed-flow, and regenerative turbo-heaters/reactors for hydrocarbon cracking — the core PhD thesis on high-enthalpy gas heating for industrial decarbonisation. The aerodynamic foundations developed here were later validated at petrochemical pilot scale."
  tags:
    - Turbomachinery
    - Supersonic Flows
    - Reacting Flows
  link_label: "PhD Thesis"
  link_url: "https://ora.ox.ac.uk/objects/uuid:2479abe8-fefb-4574-b573-a309c278a614"

- category: phd
  title: "PhD Simulation & Design Stack"
  period: "Oxford PhD"
  description: "In-house Fortran/MPI CFD with parallel LES on ARC and CSD3; hybrid SAS Spalart–Allmaras turbulence model calibrated via Bayesian optimisation; supersonic rotor and stator design codes using the method of characteristics for ultra-high-loading stages."
  tags:
    - Fortran / OpenMPI
    - LES
    - HPC (ARC, CSD3, Rescale)
    - Method of Characteristics

- category: project
  title: "Multi-Stage Meanline Toolchain — Reacting Flow Extension"
  description: "Extended the Oxford Thermofluids Institute's in-house multi-stage meanline code with inline Cantera chemistry, Bayesian optimisation and Pareto-front multi-objective search, for rapid performance and yield screening of turbo-reactor stages. Its validated runs also supply the reference reaction paths for the learned chemistry below."
  tags:
    - Meanline Methods
    - Cantera
    - Fortran / Python
    - Bayesian Optimisation
    - Multi-Objective GA (Pareto)

- category: project
  title: "RateNet — Physics-Informed Neural Rate Closures"
  description: "Replaces detailed pyrolysis kinetics (153 species, 2,146 reactions) with a PINN that predicts the reaction rates of 13 lumped species from the local state of a CFD cell. Trained on Cantera reactor databases with physics penalties (sign, Arrhenius consistency, mass balance), it matches Cantera along a reactor meanline with a median rate ratio of 1.00, and exports to a self-checking format that Fortran solvers read without PyTorch. Manuscript in preparation."
  tags:
    - PyTorch
    - PINNs
    - Cantera
    - Reduced Chemistry
    - Fortran Export
  proprietary: true

- category: project
  title: "TBLOCK-X — Learned Chemistry in a Turbomachinery CFD Solver"
  description: "Puts RateNet inside a production multiblock turbomachinery solver of the TBLOCK lineage, so full 3D turbo-reactor simulations carry reacting chemistry at about 15× the cost of a non-reacting step — against an estimated 350–11,000× for detailed kinetics. Runs to 972 blocks on CSD3 with turbulence, mixing and sliding planes; one switch turns the chemistry on, and off the solver is bit-identical to the original. Verified in the coupled system for conservation, bounds and rank-count independence."
  tags:
    - Fortran / MPI
    - CFD
    - PINN Coupling
    - Turbomachinery
    - HPC (CSD3)
  proprietary: true

- category: project
  title: "NeSC — Neuro-Symbolic Closure"
  description: "Turns neural chemistry surrogates into compact, human-readable rate laws. A physics-informed network trained on reactor simulations is distilled by symbolic regression into closed-form expressions that a CFD solver can use directly — interpretable chemistry instead of a black box."
  tags:
    - PINNs
    - Symbolic Regression
    - Reacting Flows
  proprietary: true

- category: project
  title: "Super Rotor Designer"
  description: "Supersonic impulse-rotor design workflow: parametric blade geometry from a method-of-characteristics solver, evaluated aerodynamically in MISES."
  tags:
    - Python
    - MATLAB
    - Method of Characteristics
    - MISES

- category: project
  title: "PlugFlowML"
  description: "Open-source, MIT-licensed 10-lesson graduate course teaching ML surrogate modelling for physical simulation on reactor chemistry — tree ensembles, neural nets, PINNs, symbolic regression, and Bayesian optimisation, from Cantera-generated plug-flow-reactor data through to a distilled symbolic surrogate. Runs end-to-end on free Colab against a shared sample dataset."
  tags:
    - PyTorch
    - PINNs
    - Symbolic Regression (PySR)
    - Cantera
    - Bayesian Optimisation
  github: "https://github.com/karefyllidis/PlugFlowML"

- category: project
  title: "SEBO — Sample-Efficient Bayesian Optimizer"
  description: "Sample-efficient Bayesian optimiser built from scratch and published to PyPI. GP surrogate with competing kernels (RBF, Matérn ν=1.5) chosen each round by log-marginal likelihood; ensemble acquisition (EI/PI/UCB) with log/Box-Cox output warping for objectives spanning orders of magnitude. Benchmarked against Optuna-TPE and TuRBO on 6 synthetic functions; originally written for the NeurIPS 2020 BBO Challenge."
  tags:
    - Python
    - Gaussian Processes
    - Bayesian Optimisation
    - PyPI
  github: "https://github.com/karefyllidis/SEBO"
  link_url: "https://pypi.org/project/sebo/"
  link_label: "PyPI"
